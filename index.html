<!doctype html>
<html lang="de" class="is-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Kleiderschrank</title>
    <meta name="description" content="Kleidung einscannen, Outfits am eigenen Foto zusammenstellen und speichern." />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- „default“ statt „black-translucent“: translucent erzwingt WEISSE Statusleisten-Schrift über unserem
         hellen Inhalt (unlesbar). Mit „default“ zeichnet iOS die Leiste passend zum Erscheinungsbild
         (dunkle Schrift hell, helle Schrift dunkel); der Inhalt beginnt darunter, safe-area-inset-top ist dann 0. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Schrank" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <style>
      /* Startbildschirm ohne Aufblitzen: Grundfarbe sofort, bevor CSS/JS geladen sind */
      html { background: #F2F2F7; }
      @media (prefers-color-scheme: dark) { html { background: #000; } }
      html, body { margin: 0; height: 100%; }
      html.is-booting #app { opacity: 0; }
      #app { transition: opacity .25s ease-out; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
